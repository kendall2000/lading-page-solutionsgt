services:
  solutionsgt-php:
    image: solutionsgt-php
    container_name: solutionsgt-php
    build: .
    ports:
      # 8093 ERP, 8094 ONG, 8096 restaurante: este sitio usa 8097.
      - "8097:80"
    networks:
      - red-external-network
    restart: always
    env_file:
      - .env
    volumes:
      # .env del host (para cambiar config sin rebuild). Nunca va dentro de la imagen.
      - ./.env:/var/www/html/.env
      # Logs y caché de Laravel entre rebuilds (las imágenes van a Contabo).
      - solutionsgt-storage:/var/www/html/storage

  # Tiempo real del chat (Laravel Reverb, compatible con Pusher/Echo). Misma imagen, otro proceso.
  # El sitio le envía los eventos por la red interna (REVERB_HOST=solutionsgt-reverb, REVERB_PORT=8080)
  # y el navegador se conecta por el puerto público 8098 (REVERB_PUBLICO_HOST / REVERB_PUBLICO_PORT).
  solutionsgt-reverb:
    image: solutionsgt-php
    container_name: solutionsgt-reverb
    depends_on:
      - solutionsgt-php
    command: ["php", "artisan", "reverb:start", "--host=0.0.0.0", "--port=8080"]
    ports:
      - "8098:8080"
    networks:
      - red-external-network
    restart: always
    env_file:
      - .env
    environment:
      # Las migraciones (si están activadas) solo las corre el contenedor del sitio.
      RUN_MIGRATIONS: "false"
    volumes:
      - ./.env:/var/www/html/.env
      - solutionsgt-storage:/var/www/html/storage
    healthcheck:
      test: ["CMD-SHELL", "php -r 'exit(@fsockopen(\"127.0.0.1\", 8080) ? 0 : 1);'"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Tareas programadas (routes/console.php): respaldo de la base a las 3:00 y limpieza a las 3:30.
  # Corre como www-data para que los logs que escriba los pueda seguir escribiendo Apache.
  solutionsgt-tareas:
    image: solutionsgt-php
    container_name: solutionsgt-tareas
    depends_on:
      - solutionsgt-php
    user: www-data
    command: ["php", "artisan", "schedule:work"]
    networks:
      - red-external-network
    restart: always
    env_file:
      - .env
    environment:
      RUN_MIGRATIONS: "false"
    volumes:
      - ./.env:/var/www/html/.env
      - solutionsgt-storage:/var/www/html/storage

volumes:
  solutionsgt-storage:

networks:
  red-external-network:
    external: true
